name: RotorDin B10 offline wheelhouse

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/b10-wheelhouse.yml'

jobs:
  wheelhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build complete offline dependency wheelhouse
        run: |
          set -euo pipefail
          python -m pip install -U pip wheel setuptools
          mkdir -p wheelhouse
          python -m pip wheel --wheel-dir wheelhouse \
            'PySide6>=6.7' \
            'PyYAML>=6.0' \
            'pytest>=8.0' \
            'pytest-cov>=5.0' \
            'pytest-qt>=4.4' \
            'numpy>=1.26' \
            'plotly==5.24.1' \
            'ross-rotordynamics @ git+https://github.com/petrobras/ross.git@a26a66fe40e8b86aa5e5c203d18cca801e68ff8e'
          python - <<'PY'
          from pathlib import Path
          files=sorted(p.name for p in Path('wheelhouse').glob('*'))
          Path('wheelhouse/CONTENTS.txt').write_text('\n'.join(files)+'\n')
          print('\n'.join(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rotordin-b10-wheelhouse-py313-linux
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 7

name: ROSS 2.3 certified physical smoke

on:
  push:
    branches: ["ci/ross-certified-smoke-20260908"]
  workflow_dispatch:

jobs:
  ross-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install certified ROSS provider
        run: |
          python -m pip install --upgrade pip
          # ROSS 2.3 registers a Plotly theme containing scattermapbox. Plotly 7
          # removed that template property, so keep the certified visualization
          # dependency at the last 5.x line used by this provider contract.
          python -m pip install "plotly==5.24.1"
          python -m pip install "ross-rotordynamics @ git+https://github.com/petrobras/ross.git@a26a66fe40e8b86aa5e5c203d18cca801e68ff8e"
      - name: Show immutable provider identity
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import json
          import plotly
          import ross
          dist = metadata.distribution("ross-rotordynamics")
          direct = json.loads(dist.read_text("direct_url.json") or "null")
          print("ROSS version:", ross.__version__)
          print("Plotly version:", plotly.__version__)
          print("direct_url:", json.dumps(direct, indent=2))
          assert ross.__version__ == "2.3.0"
          assert plotly.__version__ == "5.24.1"
          assert direct["vcs_info"]["commit_id"] == "a26a66fe40e8b86aa5e5c203d18cca801e68ff8e"
          PY
      - name: Run PlainJournal and TiltingPad numerical oracles
        run: python ross_certified_smoke.py
      - name: Freeze numerical environment
        if: always()
        run: python -m pip freeze > ross_certified_environment.txt
      - name: Upload numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ross-certified-smoke-evidence
          path: |
            ross_certified_smoke_evidence.json
            ross_certified_environment.txt
          if-no-files-found: warn
